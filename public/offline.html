<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>Offline · TRIPLE DIMENSION</title>
    <link rel="icon" href="/public/icons/icon-192.png" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        padding: 24px; background: #f1f5f9; color: #0f172a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .card {
        width: 100%; max-width: 380px; padding: 32px 24px; text-align: center;
        background: #fff; border: 1px solid #e2e8f0; border-radius: 16px;
      }
      img { width: 72px; height: 72px; }
      h1 { margin: 16px 0 8px; font-size: 20px; }
      p { margin: 0 0 24px; color: #475569; line-height: 1.5; }
      button {
        width: 100%; padding: 12px 16px; border: 0; border-radius: 12px;
        background: #2563eb; color: #fff; font-size: 16px; font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/public/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>TRIPLE DIMENSION needs an internet connection. Check your mobile data or Wi-Fi, then try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
    <script>window.addEventListener('online', function () { location.reload(); });</script>
  </body>
</html>
